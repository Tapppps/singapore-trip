let state=JSON.parse(localStorage.getItem("sgTripV34")||"null")||{day:0,routes:masterPlans.map(x=>[...x])};if(!Array.isArray(state.routes)||state.routes.length<4)state.routes=masterPlans.map(x=>[...x]);
let map,routeLayer=null,haloLayer=null,arrowLayer=null,stopMarkers=[],userMarker=null,userPos=null,watchId=null;let routeCoords=[],stopCoordIndex=[],currentIndex=0,routeFloat=0,lastTouchY=null,drawerOpen=false;
function save(){localStorage.setItem("sgTripV34",JSON.stringify(state))}function byId(id){return stops.find(s=>s.id===id)}function routeStops(){return state.routes[state.day].map(byId).filter(Boolean)}function hav(a,b){const R=6371,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lng-a.lng)*p,la1=a.lat*p,la2=b.lat*p,x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function smartLeg(a,b){return hav(a,b)<=.85?"walk":"mrt"}function nearestMRT(p){return mrt.slice().sort((a,b)=>hav(p,a)-hav(p,b))[0]}
function buildGraph(){const g={};for(const [line,sts] of Object.entries(mrtNetworks))sts.forEach((s,i)=>{if(!g[s[0]])g[s[0]]=[];if(i)g[s[0]].push({to:sts[i-1][0],line});if(i<sts.length-1)g[s[0]].push({to:sts[i+1][0],line})});return g}const mrtGraph=buildGraph();

async function footRoute(a,b){const url=`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&steps=true`;const r=await fetch(url);if(!r.ok)throw new Error("route");const j=await r.json();if(j.code!=="Ok"||!j.routes?.length)throw new Error("route");return j.routes[0]}
function initMap(){if(typeof L==="undefined"){document.getElementById("statusTitle").textContent="Map library failed to load";return}map=L.map("map",{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:true,touchZoom:true,boxZoom:true,keyboard:true,inertia:true});L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{maxZoom:20,subdomains:"abcd",attribution:"&copy; OpenStreetMap &copy; CARTO"}).addTo(map);map.setView([1.297,103.856],14);setupGesture();buildRoute()}
async function buildRoute(){const rs=routeStops();routeCoords=[];stopCoordIndex=[];let idx=0;statusTitle.textContent="Building route…";statusSub.textContent="Drawing a visible route line.";for(let i=0;i<rs.length-1;i++){stopCoordIndex[i]=idx;const a=rs[i],b=rs[i+1];let coords;try{coords=smartLeg(a,b)==="walk"?(await footRoute(a,b)).geometry.coordinates.map(c=>[c[1],c[0]]):mrtCoords(a,b)}catch(e){coords=[[a.lat,a.lng],[b.lat,b.lng]]}coords=coords.filter(c=>Number.isFinite(c[0])&&Number.isFinite(c[1]));if(i>0)coords=coords.slice(1);routeCoords.push(...coords);idx=routeCoords.length-1}stopCoordIndex[rs.length-1]=Math.max(0,routeCoords.length-1);if(routeLayer)map.removeLayer(routeLayer);if(haloLayer)map.removeLayer(haloLayer);if(arrowLayer)map.removeLayer(arrowLayer);stopMarkers.forEach(m=>m.remove());stopMarkers=[];const colour=["#0050A4","#E32017","#009645","#8B4513"][state.day]||"#1677ff";haloLayer=L.polyline(routeCoords,{color:"#fff",weight:16,opacity:.98,lineJoin:"round",lineCap:"round"}).addTo(map);routeLayer=L.polyline(routeCoords,{color:colour,weight:9,opacity:1,lineJoin:"round",lineCap:"round"}).addTo(map);arrowLayer=L.layerGroup().addTo(map);for(let i=10;i<routeCoords.length-5;i+=30){const p=routeCoords[i],n=routeCoords[Math.min(i+3,routeCoords.length-1)];const ang=Math.atan2(n[1]-p[1],n[0]-p[0])*180/Math.PI;const icon=L.divIcon({className:"",html:`<div class="route-arrow-icon" style="transform:rotate(${ang}deg)">➤</div>`,iconSize:[20,20],iconAnchor:[10,10]});L.marker(p,{icon,interactive:false}).addTo(arrowLayer)}rs.forEach((s,i)=>{const icon=L.divIcon({className:"",html:`<div class="route-marker">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]});const m=L.marker([s.lat,s.lng],{icon}).addTo(map);m.on("click",()=>selectStep(Math.min(i,rs.length-2),true));stopMarkers.push(m)});currentIndex=0;routeFloat=0;renderDrawer();selectStep(0,false);statusTitle.textContent="Follow the coloured route line";statusSub.textContent="Swipe upward to move forward. Arrows show d function setupGesture(){const el=map.getContainer();el.addEventListener("touchstart",e=>{if(e.touches.length===1)lastTouchY=e.touches[0].clientY},{passive:true});el.addEventListener("touchmove",e=>{if(e.touches.length!==1||lastTouchY===null)return;e.preventDefault();const y=e.touches[0].clientY,dy=lastTouchY-y;lastTouchY=y;advanceRoute(dy/18)},{passive:false});el.addEventListener("touchend",()=>lastTouchY=null,{passive:true});el.addEventListener("wheel",e=>{if(e.ctrlKey)return;e.preventDefault();advanceRoute(e.deltaY/22)},{passive:false})}

function updateSummary(step){const rs=routeStops(),small=document.getElementById("summarySmall"),title=document.getElementById("summaryTitle"),text=document.getElementById("summaryText");if(!rs[step]||!rs[step+1])return;if(small)small.textContent=`Step ${step+1} of ${rs.length-1}`;if(title)title.textContent=`${rs[step].name} → ${rs[step+1].name}`;if(text)text.textContent=`${smartLeg(rs[step],rs[step+1])==="walk"?"Walk":"MRT / transport"} · follow the coloured route line`}
function renderDrawer(){const rs=routeStops(),body=document.getElementById("drawerBody");body.innerHTML=rs.slice(0,-1).map((a,i)=>`<div class="stepcard" data-step="${i}"><div class="stephead"><div class="num">${i+1}</div><div><h3>${a.name} → ${rs[i+1].name}</h3><p>${a.desc||""}</p><button data-stepbtn="${i}">Show this step</button></div></div></div>`).join("");body.querySelectorAll("[data-stepbtn]").forEach(b=>b.addEventListener("click",()=>selectStep(Number(b.dataset.stepbtn),true)))}function highlightDrawer(step){document.querySelectorAll(".stepcard").forEach(c=>c.classList.toggle("active",Number(c.dataset.step)===step))}function toggleDrawer(force){drawerOpen=typeof force==="boolean"?force:!drawerOpen;const d=document.getElementById("drawer");d.classList.toggle("expanded",drawerOpen);d.classList.toggle("collapsed",!drawerOpen);document.getElementById("moreBtn").textContent=drawerOpen?"Hide":"More"}
function renderHeader(){dayTitle.textContent=days[state.day].title;daySub.textContent=`${days[state.day].label} · simplified route`}function renderDays(){dayRows.innerHTML=days.map((d,i)=>`<div class="dayrow"><div><b>${d.label}</b><div style="font-size:12px;color:#667">${d.title}</div></div><button data-day="${i}">${i===state.day?"Current":"Open"}</button></div>`).join("");dayRows.querySelectorAll("[data-day]").forEach(b=>b.addEventListener("click",()=>setDay(Number(b.dataset.day))))}async function setDay(i){state.day=i;save();renderHeader();document.getElementById("daySheet").classList.remove("open");renderDays();await buildRoute()}
function locateMe(){if(!navigator.geolocation){alert("GPS not available.");return}navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};drawUser();syncGps(true);startWatch()},()=>alert("Allow location access for GPS."),{enableHighAccuracy:true,timeout:10000,maximumAge:10000})}function drawUser(){if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker([userPos.lat,userPos.lng],{radius:8,color:"#fff",weight:4,fillColor:"#1677ff",fillOpacity:1}).addTo(map)}function startWatch(){if(watchId!==null)return;watchId=navigator.geolocation.watchPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};drawUser();syncGps(false)},()=>{},{enableHighAccuracy:true,maximumAge:10000,timeout:12000})}function syncGps(animate){if(!userPos||!routeCoords.length)return;let best=0,bd=Infinity;routeCoords.forEach((c,i)=>{const d=hav(userPos,{lat:c[0],lng:c[1]});if(d<bd){bd=d;best=i}});currentIndex=best;routeFloat=best;cameraToIndex(best,animate);updateStepFromCoord();statusTitle.textContent=`GPS · ${Math.round(bd*1000)} m from route`;statusSub.textContent="Current position follows the route line."}function goCurrent(){userPos?syncGps(true):locateMe()}
