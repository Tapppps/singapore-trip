<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Singapore Trip</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<style>
:root{--line:#dfe3e8;--muted:#65707c;--blue:#1677ff;--bg:#eef1f4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:#17191c;overflow:hidden}
button{font:inherit}
#topbar{
 position:fixed;left:0;right:0;top:0;z-index:50;height:108px;background:rgba(255,255,255,.97);
 border-bottom:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 padding:7px 9px 8px;box-shadow:0 2px 10px rgba(0,0,0,.06)
}
.topline{height:42px;display:flex;align-items:center;gap:9px}
.iconbtn{width:39px;height:39px;border:0;border-radius:14px;background:#f5f6f8;font-size:19px}
.title{min-width:0;flex:1}
.title h1{font-size:18px;line-height:1.1;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title div{font-size:11px;color:var(--muted);margin-top:3px}
#actions{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-top:5px}
#actions::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 12px;font-size:12px;white-space:nowrap}
.pill.dark{background:#111;color:#fff;border-color:#111}
#map{position:fixed;left:0;right:0;top:108px;bottom:0;background:#e9edf1}

#mapTools{position:fixed;right:10px;top:118px;z-index:22;display:flex;flex-direction:column;gap:7px}
.mapbtn{width:42px;height:42px;border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:13px;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#drawer{
 position:fixed;left:9px;right:9px;bottom:9px;z-index:30;background:rgba(255,255,255,.98);border:1px solid var(--line);
 border-radius:21px;box-shadow:0 15px 38px rgba(0,0,0,.18);overflow:hidden;transition:height .22s ease
}
#drawer.collapsed{height:132px}
#drawer.expanded{height:min(68vh,680px)}
.handle{height:24px;display:grid;place-items:center;cursor:pointer}
.handle span{width:41px;height:5px;border-radius:99px;background:#d4d9df}
.summary{padding:0 13px 11px;display:flex;gap:10px;align-items:flex-start}
.summary .copy{min-width:0;flex:1}
.summary .small{font-size:11px;color:var(--muted);margin-bottom:3px}
.summary h2{font-size:16px;line-height:1.2;margin:0}
.summary p{font-size:12px;line-height:1.35;color:#4d5661;margin:4px 0 0}
.more{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px}
#drawerBody{height:calc(100% - 78px);overflow:auto;padding:2px 12px 14px}
.stepcard{border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;background:#fafbfc}
.stepcard.active{border-color:#b8d2ff;background:#fff;box-shadow:0 0 0 2px #e0ebff}
.stephead{display:flex;align-items:flex-start;gap:9px}
.num{width:31px;height:31px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.stepcard.active .num{background:var(--blue)}
.stepcard h3{font-size:15px;margin:1px 0 2px;line-height:1.2}
.stepcard p{font-size:12px;color:#505966;line-height:1.45;margin:5px 0 0}
.stepcard button{margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px}
#daySheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
#daySheet.open{display:flex}
.sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:12px;max-height:70vh;overflow:auto}
.sheet h2{font-size:18px;margin:5px 0 10px}
.dayrow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:11px 2px}
.dayrow:first-of-type{border-top:0}
.dayrow button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px}
.route-marker{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #111;display:grid;place-items:center;font-size:10px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{font-size:9px}
@media(max-width:699px){
 #topbar{height:111px} #map{top:111px}  #mapTools{top:121px}
 #drawer.collapsed{height:138px}
}

/* V37 free-map interaction */
.maplibregl-canvas{cursor:grab}
.maplibregl-canvas:active{cursor:grabbing}

/* V38 */


/* V39 */
#routeKey{
 position:fixed;left:10px;top:118px;z-index:1100;
 display:flex;align-items:center;gap:10px;
 padding:6px 9px;background:rgba(255,255,255,.9);
 border:1px solid var(--line);border-radius:999px;
 font-size:10px;box-shadow:0 2px 7px rgba(0,0,0,.06)
}
#routeKey span{display:flex;align-items:center;gap:4px}
#routeKey i{display:block;width:18px;height:4px;border-radius:4px}
#routeKey .walk{background:#111}
#routeKey .mrt{background:#E32017}
#routeKey .river{background:#1677FF}
@media(max-width:699px){#routeKey{top:121px}}

/* V41 route-step controls */
.step-actions{
 display:flex;gap:7px;flex-wrap:wrap;margin-top:9px
}
.step-actions button{
 margin-top:0!important;
}
.step-more{
 display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)
}
.step-more.open{display:block}
.step-more p{margin:5px 0;font-size:12px;line-height:1.5;color:#454e58}
.skip-btn{border-color:#efc7c7!important;color:#9c2525}
#otherSheet{
 position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.35);
 display:none;align-items:flex-end
}
#otherSheet.open{display:flex}
.other-intro{font-size:13px;color:var(--muted);line-height:1.45;margin:0 0 8px}
.other-item{
 border:1px solid var(--line);border-radius:16px;padding:11px;margin:8px 0;background:#fafbfc
}
.other-item h3{font-size:15px;margin:0 0 4px}
.other-item p{font-size:12px;color:#505966;line-height:1.45;margin:4px 0}
.other-item button{
 border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px
}
#otherCount{
 display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:999px;
 background:#eceff3;margin-left:4px;padding:0 5px;font-size:10px
}

/* V43 */
.num.travel-walk{background:#111}
.num.travel-mrt{background:#E32017}
.num.travel-river{background:#1677FF}
.num{
 width:40px;height:40px;position:relative;line-height:1;
 display:grid;place-items:center;padding:3px 0
}
.num .step-number{font-size:13px;font-weight:800;line-height:1}
.num .travel-letter{font-size:8px;font-weight:800;line-height:1;margin-top:-1px}
.mrt-detail{
 margin-top:8px;padding:9px 10px;background:#fff6f6;
 border-left:4px solid #E32017;border-radius:10px;
 font-size:12px;line-height:1.5;color:#333
}
.mrt-detail .mrt-title{font-weight:800;margin-bottom:4px;color:#9c1515}
.mrt-detail .mrt-change{font-weight:800;color:#9c1515;margin:4px 0}
.mrt-detail .mrt-line{margin:3px 0}

/* V44 */
#drawer.expanded #drawerBody{
 padding-bottom:110px;
}
#drawer.expanded .stepcard:last-child{
 margin-bottom:24px;
}

/* V45 clickable map route steps */
.route-marker{
 cursor:pointer;
}
.route-step-popup{
 min-width:210px;
 max-width:250px;
 padding:2px;
}
.route-step-popup h3{
 margin:0 0 5px;
 font-size:14px;
 line-height:1.25;
}
.route-step-popup p{
 margin:3px 0 8px;
 font-size:12px;
 line-height:1.4;
 color:#4d5660;
}
.route-step-popup .distance{
 font-weight:700;
 color:#222;
}
.route-step-popup button{
 width:100%;
 min-height:38px;
 border:1px solid var(--line);
 border-radius:999px;
 background:#111;
 color:#fff;
 font-weight:700;
 font-size:12px;
 cursor:pointer;
}
.maplibregl-popup-content{
 border-radius:14px!important;
 padding:10px!important;
 box-shadow:0 6px 22px rgba(0,0,0,.16)!important;
}

/* V45 selected route card */
#drawerBody .stepcard.active{
 outline:2px solid #111;
 outline-offset:1px;
}

/* V46 phone shopping */
.phone-note{
 margin-top:6px;padding:7px 9px;border-radius:10px;background:#f5f7fa;
 font-size:11px;line-height:1.4;color:#47515d
}

/* V47 drawer closing */
#drawer .handle{
 touch-action:none;
 cursor:grab;
 padding:10px 0 8px;
}
#drawer .handle:active{cursor:grabbing}
#drawer{transition:transform .22s ease,height .22s ease}

/* V48 top padding for Today's Route drawer */
#drawer{
 padding-top:18px;
}
#drawer .handle{
 padding-top:14px;
}
#drawer.expanded{
 padding-top:22px;
}
#drawer.expanded #drawerBody{
 padding-top:14px;
}

/* V50 GPS direction pointer */
.user-location-wrap{
 position:relative;
 width:28px;
 height:28px;
}
.user-location-dot{
 position:absolute;
 left:8px;top:8px;
 width:12px;height:12px;
 border-radius:50%;
 background:#1677FF;
 border:3px solid #fff;
 box-shadow:0 0 0 2px rgba(22,119,255,.25);
}
.user-location-arrow{
 position:absolute;
 left:7px;
 top:-5px;
 width:14px;
 height:16px;
 transform-origin:50% 19px;
}
.user-location-arrow:before{
 content:"";
 position:absolute;
 left:3px;top:0;
 width:0;height:0;
 border-left:4px solid transparent;
 border-right:4px solid transparent;
 border-bottom:10px solid #1677FF;
 filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));
}
</style>
</head>
<body>
<header id="topbar">
 <div class="topline">
   <button class="iconbtn" id="btnLocateTop" aria-label="Locate me">◎</button>
   <div class="title"><h1 id="dayTitle">Singapore Trip</h1><div id="daySub"></div></div>
   <button class="iconbtn" id="btnFitTop" aria-label="Show full route">↗</button>
 </div>
 <div id="actions">
   <button class="pill dark" id="btnTodayRoute">Today's route</button>
   <button class="pill" id="btnChooseDay">Choose day</button>
   <button class="pill" id="btnGps">GPS</button>
   <button class="pill" id="btnCurrent">Current step</button>
   <button class="pill" id="btnFullRoute">Full route</button>
   <button class="pill" id="btnOtherThings">Other things to do <span id="otherCount">0</span></button>
       </div>
</header>

<div id="map"></div>
</div>

<div id="routeKey">
 <span><i class="walk"></i>Walk</span>
 <span><i class="mrt"></i>MRT</span>
 <span><i class="river"></i>River</span>
</div>
<div id="mapTools">
 <button class="mapbtn" id="btnCurrentMap" title="Current step">◎</button>
 <button class="mapbtn" id="btnFitMap" title="Full route">↗</button>
</div>

<div id="drawer" class="collapsed">
 <div class="handle" id="drawerHandle"><span></span></div>
 <div class="summary">
  <div class="copy">
   <div class="small" id="summarySmall">Route</div>
   <h2 id="summaryTitle">Loading current step…</h2>
   <p id="summaryText">Street and direction details will appear here.</p>
  </div>
  <button class="more" id="drawerMore">More</button>
 </div>
 <div id="drawerBody"></div>
</div>


<div id="otherSheet">
 <div class="sheet">
  <h2>Other things to do</h2>
  <p class="other-intro">Skipped route stops are kept here so you can add them back later.</p>
  <div id="otherThingsList"></div>
  <button class="pill" id="btnCloseOther" style="width:100%;margin-top:8px">Close</button>
 </div>
</div>
<div id="daySheet">
 <div class="sheet">
  <h2>Choose day</h2>
  <div id="dayRows"></div>
  <button class="pill" id="btnCloseDays" style="width:100%;margin-top:8px">Close</button>
 </div>
</div>

<script>

const stops=[

function hav(a,b){const R=6371,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lng-a.lng)*p,la1=a.lat*p,la2=b.lat*p,x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function nearestMRT(p){return mrt.slice().sort((a,b)=>hav(p,a)-hav(p,b))[0]}
function stationCode(name,lineKey){const row=(mrtNetworks[lineKey]||[]).find(x=>x[0]===name);return row?row[1]:""}
function buildGraph(){
 const g={};
 for(const [line,sts] of Object.entries(mrtNetworks)){
  sts.forEach((s,i)=>{if(!g[s[0]])g[s[0]]=[];if(i)g[s[0]].push({to:sts[i-1][0],line});if(i<sts.length-1)g[s[0]].push({to:sts[i+1][0],line})})
 }
 return g
}

function codeOnLine(station,line){
 const row=(mrtNetworks[line]||[]).find(x=>x[0]===station);
 return row?row[1]:"";
}
function detailedMRTPath(start,end){
 if(start===end)return {stations:[start],edges:[]};
 const q=[start],prev={[start]:null},prevLine={};
 while(q.length){
  const n=q.shift();
  for(const e of (mrtGraph[n]||[])){
   if(Object.prototype.hasOwnProperty.call(prev,e.to))continue;
   prev[e.to]=n;prevLine[e.to]=e.line;
   if(e.to===end){q.length=0;break}
   q.push(e.to);
  }
 }
 if(!Object.prototype.hasOwnProperty.call(prev,end))return {stations:[start,end],edges:[]};
 const stations=[],edges=[];let cur=end;
 while(cur!==null){
  stations.push(cur);
  const p=prev[cur];
  if(p!==null)edges.push({from:p,to:cur,line:prevLine[cur]});
  cur=p;
 }
 stations.reverse();edges.reverse();
 return {stations,edges};
}
function mrtSegmentsFor(a,b){
 const s1=nearestMRT(a),s2=nearestMRT(b);
 const path=detailedMRTPath(s1.name,s2.name);
 const segs=[];
 if(path.edges.length){
  let seg={line:path.edges[0].line,stations:[path.edges[0].from,path.edges[0].to]};
  for(let i=1;i<path.edges.length;i++){
   const e=path.edges[i];
   if(e.line===seg.line)seg.stations.push(e.to);
   else{segs.push(seg);seg={line:e.line,stations:[e.from,e.to]}}
  }
  segs.push(seg);
 }
 return {start:s1,end:s2,path,segments:segs};
}
function mrtDirectionsHtml(a,b){
 const j=mrtSegmentsFor(a,b);
 if(!j.start||!j.end)return "";
 let out=`<div class="mrt-detail"><div class="mrt-title">MRT directions</div>`;
 out+=`<div class="mrt-line"><b>Walk to:</b> ${j.start.name} ${j.start.code||""}</div>`;
 if(!j.segments.length){
  out+=`<div class="mrt-line">Use ${j.start.name}; both places have the same nearest MRT station.</div>`;
 }else{
  j.segments.forEach((seg,i)=>{
   const first=seg.stations[0],last=seg.stations[seg.stations.length-1];
   const firstCode=codeOnLine(first,seg.line),lastCode=codeOnLine(last,seg.line);
   out+=`<div class="mrt-line"><b>${mrtLineNames[seg.line]||seg.line}:</b> ${first} ${firstCode} → ${last} ${lastCode}`;
   if(seg.stations.length>2)out+=` <span style="color:#666">(${seg.stations.length-2} station${seg.stations.length-2===1?"":"s"} between)</span>`;
   out+=`.</div>`;
   if(i<j.segments.length-1){
    const next=j.segments[i+1],change=last;
    const codes=[codeOnLine(change,seg.line),codeOnLine(change,next.line)].filter(Boolean).join(" / ");
    out+=`<div class="mrt-change">Change at ${change}${codes?` ${codes}`:""} → ${mrtLineNames[next.line]||next.line}</div>`;
   }
  });
 }
 out+=`<div class="mrt-line"><b>Get off:</b> ${j.end.name} ${j.end.code||""}, then walk to ${b.name}.</div></div>`;
 return out;
}

function shortestMRTPath(a,b){
 if(a===b)return [a];const q=[a],prev={[a]:null};
 while(q.length){const n=q.shift();for(const e of (mrtGraph[n]||[])){if(Object.prototype.hasOwnProperty.call(prev,e.to))continue;prev[e.to]=n;if(e.to===b){q.length=0;break}q.push(e.to)}}
 if(!Object.prototype.hasOwnProperty.call(prev,b))return [a,b];
 const out=[];let c=b;while(c!==null){out.push(c);c=prev[c]}return out.reverse()
}

}

function bearing(a,b){
 const p=Math.PI/180,la1=a[1]*p,la2=b[1]*p,dl=(b[0]-a[0])*p;
 const y=Math.sin(dl)*Math.cos(la2),x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dl);
 return (Math.atan2(y,x)*180/Math.PI+360)%360
}

 });

 wrap.appendChild(btn);

 stepPopup=new maplibregl.Popup({
   closeButton:true,
   closeOnClick:false,
   offset:20,
   maxWidth:"270px"
 })
 .setLngLat([stop.lng,stop.lat])
 .setDOMContent(wrap)
 .addTo(map);
}

async function buildRoute(){
 const rs=routeStops();
 routeCoords=[];
 stopCoordIndex=[];
 let idx=0;
 const features=[];

 for(let i=0;i<rs.length-1;i++){
  stopCoordIndex[i]=idx;
  const a=rs[i],b=rs[i+1];
  const mode=legMode(a,b);
  let coords=[];

  try{
   if(mode==="river"){
    coords=riverCruiseCoords(a,b);
   }else if(mode==="mrt"){
    coords=mrtCoords(a,b);
   }else{
    coords=(await footRoute(a,b)).geometry.coordinates;
   }
  }catch(e){
   coords=[[a.lng,a.lat],[b.lng,b.lat]];
  }

  coords=(coords||[]).filter(c=>Array.isArray(c)&&Number.isFinite(c[0])&&Number.isFinite(c[1]));
  if(!coords.length)continue;

  features.push({
   type:"Feature",
   properties:{mode,from:a.id,to:b.id},
   geometry:{type:"LineString",coordinates:coords}
  });

  let merged=coords;
  if(i>0 && merged.length)merged=merged.slice(1);
  routeCoords.push(...merged);
  idx=Math.max(0,routeCoords.length-1);
 }

 stopCoordIndex[rs.length-1]=Math.max(0,routeCoords.length-1);

 const data={type:"FeatureCollection",features};

 ["route-main","route-halo"].forEach(id=>{if(map.getLayer(id))map.removeLayer(id)});
 if(map.getSource("route"))map.removeSource("route");

 map.addSource("route",{type:"geojson",data});

 map.addLayer({
  id:"route-halo",
  type:"line",
  source:"route",
  layout:{"line-join":"round","line-cap":"round"},
  paint:{
   "line-color":"#ffffff",
   "line-width":14,
   "line-opacity":.98
  }
 });

 map.addLayer({
  id:"route-main",
  type:"line",
  source:"route",
  layout:{"line-join":"round","line-cap":"round"},
  paint:{
   "line-color":[
    "match",["get","mode"],
    "walk","#111111",
    "mrt","#E32017",
    "river","#1677FF",
    "#111111"
   ],
   "line-width":[
    "match",["get","mode"],
    "walk",7,
    "mrt",8,
    "river",8,
    7
   ],
   "line-opacity":1
  }
 });

 clearStopMarkers();
 rs.forEach((s,i)=>{
  const el=document.createElement("div");
  el.className="route-marker";
  el.textContent=i+1;
  el.title=rs[i].name;
  el.addEventListener("click",e=>{
   e.stopPropagation();
   showMapStepPopup(i);
  });
  stopMarkers.push(
   new maplibregl.Marker({element:el,anchor:"center"})
    .setLngLat([s.lng,s.lat])
    .addTo(map)
  );
 });

 currentIndex=0;
 routeScrollFloat=0;
 renderDrawer();
 selectStep(0,false);
}

let stopMarkers=[];
function clearStopMarkers(){stopMarkers.forEach(m=>m.remove());stopMarkers=[]}
function fitRoute(){
 if(!routeCoords.length)return;
 map.easeTo({bearing:0,pitch:0,duration:0});
 const b=routeCoords.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(routeCoords[0],routeCoords[0]));
 map.fitBounds(b,{padding:{top:100,bottom:190,left:40,right:40},duration:700,maxZoom:16});
}
function setupGesture(){
 // V37: use native map gestures.
 // One-finger drag pans; mouse drag pans; pinch and wheel zoom.
}
function advanceRoute(delta){
 if(!routeCoords.length)return;
 routeScrollFloat=Math.max(0,Math.min(routeCoords.length-1,routeScrollFloat+delta));
 currentIndex=Math.round(routeScrollFloat);cameraToIndex(currentIndex,false);updateStepFromCoord();
}
function cameraToIndex(i,animate=true){
 if(!routeCoords.length)return;
 i=Math.max(0,Math.min(routeCoords.length-1,i));
 const p=routeCoords[i];
 map.easeTo({
   center:p,
   bearing:0,
   pitch:0,
   zoom:Math.max(map.getZoom(),16),
   offset:[0,120],
   duration:animate?350:0
 });
}
function updateStepFromCoord(){
 let step=0;for(let i=0;i<stopCoordIndex.length-1;i++)if(currentIndex>=stopCoordIndex[i])step=i;
 step=Math.min(step,routeStops().length-2);updateSummary(step)
}
function selectStep(step,animate=true){
 const i=stopCoordIndex[step]||0;currentIndex=i;routeScrollFloat=i;cameraToIndex(i,animate);updateSummary(step);highlightDrawer(step)
}
function updateSummary(step){
 const rs=routeStops();
 const small=document.getElementById("summarySmall");
 const title=document.getElementById("summaryTitle");
 const text=document.getElementById("summaryText");
 if(!rs[step]||!rs[step+1])return;

 const a=rs[step],b=rs[step+1],mode=legMode(a,b);
 if(small)small.textContent=`Step ${step+1} of ${rs.length-1} · ${mode==="walk"?"WALK":mode==="river"?"RIVER":"MRT"}`;
 if(title)title.textContent=`${a.name} → ${b.name}`;

 if(text){
  if(mode==="mrt"){
   const j=mrtSegmentsFor(a,b);
   const changes=j.segments.slice(0,-1).map(seg=>seg.stations[seg.stations.length-1]);
   text.textContent=`MRT: ${j.start.name} ${j.start.code||""} → ${j.end.name} ${j.end.code||""}${changes.length?` · change at ${changes.join(", ")}`:""}`;
  }else if(mode==="river"){
   text.textContent="River route · follow the blue route line";
  }else{
   text.textContent="Walk · follow the black route line";
  }
 }
}

function routeStopById(id){return byId(id)}
function isRequiredStopIndex(i,rs){
 // protect day start/end anchors
 return i===0 || i===rs.length-1;
}
function skipStep(stepIndex){
 const rs=routeStops();
 const targetIndex=stepIndex+1;
 if(targetIndex<=0 || targetIndex>=rs.length)return;

 const stop=rs[targetIndex];
 if(!stop)return;

 state.skipped=state.skipped||[[],[],[],[]];
 while(state.skipped.length<4)state.skipped.push([]);

 // Always save skipped stop in Other things to do.
 if(!state.skipped[state.day].includes(stop.id)){
  state.skipped[state.day].push(stop.id);
 }

 // Remove only that stop from today's active route.
 state.routes[state.day]=state.routes[state.day].filter(id=>id!==stop.id);

 save();
 renderHeader();
 renderDrawer();
 renderOtherThings();
 buildRoute();
}
function addSkippedBack(id){
 state.skipped[state.day]=state.skipped[state.day].filter(x=>x!==id);
 if(!state.routes[state.day].includes(id)){
   const route=state.routes[state.day];
   const end=route.pop();
   route.push(id,end);
 }
 save();
 renderDrawer();
 renderOtherThings();
 buildRoute();
}
function renderOtherThings(){
 const list=document.getElementById("otherThingsList");
 const count=document.getElementById("otherCount");
 const ids=state.skipped[state.day]||[];
 if(count)count.textContent=ids.length;
 if(!list)return;
 if(!ids.length){
   list.innerHTML='<div class="other-item"><p>No skipped stops yet. Anything you choose “Skip this stop” for will appear here.</p></div>';
   return;
 }
 list.innerHTML=ids.map(id=>{
   const s=byId(id);
   if(!s)return "";
   return `<div class="other-item">
     <h3>${s.name}</h3>
     <p>${s.desc||""}</p>
     ${(s.priority||"").includes("Phone")?`<div class="phone-note">Phone shopping stop — add it only if you want to compare or buy a handset.</div>`:""}
     ${s.photo?`<p><b>Note:</b> ${s.photo}</p>`:""}
     <button type="button" data-addback="${s.id}">Add back to today</button>
   </div>`;
 }).join("");
 list.querySelectorAll("[data-addback]").forEach(b=>b.addEventListener("click",()=>addSkippedBack(b.dataset.addback)));
}
function toggleStepMore(stepIndex){
 const el=document.getElementById(`step-more-${stepIndex}`);
 if(!el)return;
 el.classList.toggle("open");
 const btn=document.querySelector(`[data-more-step="${stepIndex}"]`);
 if(btn)btn.textContent=el.classList.contains("open")?"Less":"More";
}
function nearbyDetailForStop(s){
 const nearby=stops.filter(x=>x.id!==s.id && Number.isFinite(x.lat) && hav(s,x)<=1.0)
  .sort((a,b)=>hav(s,a)-hav(s,b))
  .slice(0,4);
 return nearby.map(x=>`${x.name} (${hav(s,x).toFixed(1)} km)`).join("<br>") || "No saved nearby stops.";
}

function renderDrawer(){
 const rs=routeStops(),body=document.getElementById("drawerBody");
 if(!body)return;

 body.innerHTML=rs.slice(0,-1).map((a,i)=>{
   const b=rs[i+1],mode=legMode(a,b);
   return `<div class="stepcard" data-step="${i}">
    <div class="stephead">
     ${travelBubble(mode,i+1)}
     <div style="min-width:0;flex:1">
      <h3>${a.name} → ${b.name}</h3>
      <p>${a.desc||""}</p>

      <div class="step-actions">
       <button type="button" data-stepbtn="${i}">Show this step</button>
       <button type="button" data-more-step="${i}">More</button>
       ${mode==="walk"?`<button type="button" data-mrt-step="${i}">MRT instead</button>`:""}
       ${mode==="mrt" && state.modeOverrides && state.modeOverrides[legKey(a,b)]==="mrt"?`<button type="button" data-clear-mode="${i}">Use normal route</button>`:""}
       <button type="button" class="skip-btn" data-skip-step="${i}">Skip this stop</button>
      </div>

      <div class="step-more" id="step-more-${i}">
       <p><b>At ${a.name}:</b> ${a.desc||"Continue along the planned route."}</p>
       <p><b>Next stop — ${b.name}:</b> ${b.desc||""}</p>
       ${b.photo?`<p><b>Photo tip:</b> ${b.photo}</p>`:""}
       <p><b>Nearby:</b><br>${nearbyDetailForStop(b)}</p>
       <p><b>Travel:</b> ${mode==="walk"?"Walking route":mode==="river"?"River route":"MRT / public transport route"}.</p>
       ${mode==="mrt"?mrtDirectionsHtml(a,b):""}
      </div>
     </div>
    </div>
   </div>`;
 }).join("");

 body.querySelectorAll("[data-stepbtn]").forEach(btn=>btn.addEventListener("click",()=>{
   selectStep(Number(btn.dataset.stepbtn),true);
   toggleDrawer(false);
 }));
 body.querySelectorAll("[data-more-step]").forEach(btn=>btn.addEventListener("click",()=>{
   toggleStepMore(Number(btn.dataset.moreStep));
 }));
 body.querySelectorAll("[data-mrt-step]").forEach(btn=>btn.addEventListener("click",()=>{
   setLegMRT(Number(btn.dataset.mrtStep));
 }));
 body.querySelectorAll("[data-clear-mode]").forEach(btn=>btn.addEventListener("click",()=>{
   clearLegOverride(Number(btn.dataset.clearMode));
 }));
 body.querySelectorAll("[data-skip-step]").forEach(btn=>btn.addEventListener("click",()=>{
   skipStep(Number(btn.dataset.skipStep));
 }));

 updateSummary(0);
 highlightDrawer(0);
 renderOtherThings();
}
function highlightDrawer(step){document.querySelectorAll(".stepcard").forEach(c=>c.classList.toggle("active",Number(c.dataset.step)===step))}
function toggleDrawer(force){
 drawerOpen=typeof force==="boolean"?force:!drawerOpen;
 if(drawer)drawer.style.transform="";
 drawer.classList.toggle("expanded",drawerOpen);
 drawer.classList.toggle("collapsed",!drawerOpen);
 const b=document.getElementById("drawerMore");
 if(b)b.textContent=drawerOpen?"Hide":"More";
}
function openDays(){daySheet.classList.add("open")} function closeDays(){daySheet.classList.remove("open")}
function renderDays(){
 dayRows.innerHTML=days.map((d,i)=>`<div class="dayrow"><div><b>${d.label}</b><div style="font-size:12px;color:#667">${d.title}</div></div><button onclick="setDay(${i})">${i===state.day?"Current":"Open"}</button></div>`).join("")
}
async function setDay(i){
 state.day=i;save();currentIndex=0;routeScrollFloat=0;dayTitle.textContent=days[i].title;daySub.textContent=`${days[i].label} · simplified route`;closeDays();await buildRoute()
}
function goCurrent(){gpsFollow=true;if(userPos)syncGps(true);else locateMe()}
function locateMe(){
 bindDeviceHeading();
 gpsFollow=true;
 if(!navigator.geolocation){alert("GPS is not available in this browser.");return}
 navigator.geolocation.getCurrentPosition(p=>{userPos={lng:p.coords.longitude,lat:p.coords.latitude};drawUser();syncGps(true);startWatch()},()=>alert("Allow location access for GPS route following."),{enableHighAccuracy:true,timeout:10000,maximumAge:10000})
}
function applyUserHeading(){
 if(!userMarker)return;
 const el=userMarker.getElement ? userMarker.getElement() : null;
 const arrow=el?.querySelector(".user-location-arrow");
 if(!arrow)return;
 if(Number.isFinite(userHeading)){
  arrow.style.display="block";
  arrow.style.transform=`rotate(${userHeading}deg)`;
 }else{
  arrow.style.display="none";
 }
}
function drawUser(){
 if(!userPos)return;

 if(!userMarker){
  const el=document.createElement("div");
  el.className="user-location-wrap";
  el.innerHTML='<div class="user-location-arrow"></div><div class="user-location-dot"></div>';
  userMarker=new maplibregl.Marker({element:el,anchor:"center"})
    .setLngLat([userPos.lng,userPos.lat])
    .addTo(map);
 }else{
  userMarker.setLngLat([userPos.lng,userPos.lat]);
 }

 applyUserHeading();
}
function bindDeviceHeading(){
 if(headingWatchBound)return;
 headingWatchBound=true;

 const update=e=>{
  let h=null;

  // iOS Safari provides webkitCompassHeading.
  if(Number.isFinite(e.webkitCompassHeading)){
   h=e.webkitCompassHeading;
  }else if(Number.isFinite(e.alpha)){
   // Approximate compass heading from device orientation.
   h=(360-e.alpha)%360;
  }

  if(Number.isFinite(h)){
   userHeading=h;
   applyUserHeading();
  }
 };

 const attach=()=>{
  if("DeviceOrientationEvent" in window){
   window.addEventListener("deviceorientationabsolute",update,true);
   window.addEventListener("deviceorientation",update,true);
  }
 };

 if(typeof DeviceOrientationEvent!=="undefined" &&
    typeof DeviceOrientationEvent.requestPermission==="function"){
   DeviceOrientationEvent.requestPermission()
     .then(state=>{if(state==="granted")attach()})
     .catch(()=>{});
 }else{
   attach();
 }
}
function syncGps(animate){
 if(stepPopup){stepPopup.remove();stepPopup=null}
 if(!userPos||!routeCoords.length)return;

 let best=0,bd=Infinity;
 const u={lat:userPos.lat,lng:userPos.lng};

 routeCoords.forEach((c,i)=>{
  const d=hav(u,{lat:c[1],lng:c[0]});
  if(d<bd){bd=d;best=i}
 });

 currentIndex=best;
 routeScrollFloat=best;
 updateStepFromCoord();

 // Follow GPS only until the user manually drags/zooms the map.
 if(gpsFollow){
  map.easeTo({
   center:[userPos.lng,userPos.lat],
   bearing:0,
   pitch:0,
   zoom:Math.max(map.getZoom(),16),
   duration:animate?350:0
  });
 }
}
function zoomIn(){map.zoomIn()} function zoomOut(){map.zoomOut()}
function renderHeader(){dayTitle.textContent=days[state.day].title;daySub.textContent=`${days[state.day].label} · simplified route`}

function wireV36Buttons(){
 const on=(id,fn)=>document.getElementById(id)?.addEventListener("click",fn);
 on("btnLocateTop",locateMe);
 on("btnFitTop",fitRoute);
 on("btnTodayRoute",()=>toggleDrawer(true));
 on("btnChooseDay",openDays);
 on("btnGps",locateMe);
 on("btnCurrent",goCurrent);
 on("btnFullRoute",fitRoute);
 on("btnCurrentMap",goCurrent);
 on("btnFitMap",fitRoute);
 on("drawerHandle",()=>toggleDrawer());
 on("drawerMore",e=>{e.stopPropagation();toggleDrawer()});


 const drawerEl=document.getElementById("drawer");
 const handleEl=document.getElementById("drawerHandle") || drawerEl?.querySelector(".handle");

 const drawerPointerDown=e=>{
   if(!drawerOpen)return;
   drawerDragStartY=e.clientY;
   drawerDragActive=true;
   try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
 };
 const drawerPointerMove=e=>{
   if(!drawerDragActive || drawerDragStartY===null)return;
   const dy=e.clientY-drawerDragStartY;
   if(dy>0 && drawerEl)drawerEl.style.transform=`translateY(${Math.min(dy,160)}px)`;
 };
 const drawerPointerUp=e=>{
   if(!drawerDragActive || drawerDragStartY===null)return;
   const dy=e.clientY-drawerDragStartY;
   drawerDragActive=false;
   drawerDragStartY=null;
   if(drawerEl)drawerEl.style.transform="";
   if(dy>55)toggleDrawer(false);
 };
 if(handleEl){
   ["pointerdown","pointermove","pointerup","pointercancel"].forEach(type=>{
     const fn=type==="pointerdown"?drawerPointerDown:type==="pointermove"?drawerPointerMove:drawerPointerUp;
     handleEl.addEventListener(type,fn);
   });
 }

 on("btnCloseDays",closeDays);
 on("btnOtherThings",()=>{renderOtherThings();document.getElementById("otherSheet")?.classList.add("open")});
 on("btnCloseOther",()=>document.getElementById("otherSheet")?.classList.remove("open"));
 document.getElementById("daySheet")?.addEventListener("click",e=>{if(e.target.id==="daySheet")closeDays()});
 document.getElementById("otherSheet")?.addEventListener("click",e=>{if(e.target.id==="otherSheet")e.currentTarget.classList.remove("open")});
}
wireV36Buttons();
renderHeader();
renderOtherThings();
init();

</script>
</body>
